apply plugin: 'com.android.library'

group = 'expo.modules.shopxtryon'
version = '1.0.0'

apply from: new File(project(':expo-modules-core').projectDir, 'ExpoModulesCorePlugin.gradle')
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace 'expo.modules.shopxtryon'
}

dependencies {
  implementation 'androidx.camera:camera-camera2:1.5.0-alpha03'
  implementation 'androidx.camera:camera-lifecycle:1.5.0-alpha03'
  implementation 'androidx.camera:camera-view:1.5.0-alpha03'
  implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
